<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CafeForestのメニュー紹介">
    <link rel="stylesheet" href="css/sanitize.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Menu | CafeForest</title>
</head>

<body>
    <div class="container">
        <header>
            <div class="header_flex">
                <div><a href="index.html"><img src="img/Frame 1 (4).svg" alt="ロゴ"></a></div>
                <nav id="navigation">
                    <ul>
                        <li><a href="menu.html" class="nav_text">menu</a></li>
                        <li><a href="access.html" class="nav_text">access</a></li>
                        <li><a href="news.html" class="nav_text">news</a></li>
                    </ul>
                </nav>

                <nav id="drawer_navigation">
                    <span id="line1" class="drawer_line"></span>
                    <span id="line2" class="drawer_line"></span>
                    <span id="line3" class="drawer_line"></span>
                </nav>
            </div>
        </header>
        <main id="main">
            <section>
                <h1 class="main_title">menu</h1>
            </section>
            
            <p class="menu_title">drink</p>
            <p class="border"></p>
            <div class="grid">
                <div class="grid_item grid1">
                    <img src="./img/americano.JPG" alt="アメリカーノ">
                    <p>americano</p>
                </div>
                <div class="grid_item grid2">
                    <img src="./img/cafelatte.JPG" alt="カフェラテ">
                    <p>cafe latte</p>
                </div>
                <div class="grid_item grid3">
                    <img src="./img/cocoa.JPG" alt="ココア">
                    <p>cocoa</p>
                </div>
                <div class="grid_item grid4">
                    <img src="./img/cafemoca.JPG" alt="カフェモカ">
                    <p>cafe moca</p>
                </div>
                <div class="grid_item grid5">
                    <img src="./img/matcha.JPG" alt="抹茶ラテ">
                    <p>matcha latte</p>
                </div>
                <div class="grid_item grid6">
                    <img src="./img/tea.JPG" alt="ティーラテ">
                    <p>tea latte</p>
                </div>

            </div>

            <p class="menu_title">food</p>
            <p class="border1"></p>

            <div class="grid">
                <div class="grid_item grid01">
                    <img src="./img/chocolatecake.JPG" alt="チョコレートケーキ">
                    <p>chocolate cake</p>
                </div>
                <div class="grid_item grid02">
                    <img src="./img/hotcake.JPG" alt="ホットケーキ">
                    <p>hot cake</p>
                </div>
                <div class="grid_item grid03">
                    <img src="./img/cheesecake.JPG" alt="チーズケーキ">
                    <p>cheese cake</p>
                </div>
                <div class="grid_item grid04">
                    <img src="./img/muffin.JPG" alt="ラズベリーマフィン">
                    <p>raspberry muffin</p>
                </div>

            </div>

        </main>
        <footer>
            <div><a href="index.html"><img src="img/Frame 1 (4).svg" alt="ロゴ"></a></div>
            <div class="footer_flex">
                <div class="footer_left">
                    <div><a href="#"><img src="img/inst_icon.svg" alt="インスタグラム"></a></div>
                    <p>〒930-1455</p>
                    <p>富山県富山市本宮1363-7</p>
                    <div class="shop_info">
                        <div>Tel</div>
                        <div>090-0000-0000</div>

                        <div>Open</div>
                        <div>9:00 - 16:00</div>

                        <div>Close</div>
                        <div>Sunday / Thursday</div>
                    </div>
                </div>
                <ul class="footer_right">
                    <li><a href="index.html" class="footer_text">home</a></li>
                    <li><a href="menu.html" class="footer_text">menu</a></li>
                    <li><a href="access.html" class="footer_text">access</a></li>
                    <li><a href="news.html" class="footer_text">news</a></li>
                </ul>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
